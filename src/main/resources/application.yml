spring:
  application:
    name: doc-assistant

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_doc_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:dEEpu@28}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      init:
        pull-model-strategy: never
    vectorstore:
      pgvector:
        initialize-schema: ${PGVECTOR_INIT_SCHEMA:true}
        dimensions: ${PGVECTOR_DIMENSIONS:768}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
    rag:
      retrieval:
        top-k: ${RAG_TOP_K:4}
        similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.0}

ai:
  vision:
    enabled: ${AI_VISION_ENABLED:false}
    model: ${AI_VISION_MODEL:llava}

extraction:
  max-images-per-page: ${MAX_IMAGES_PER_PAGE:5}
  min-chars-per-page: ${MIN_CHARS_PER_PAGE:50}
  render-page-if-no-images: ${RENDER_PAGE_IF_NO_IMAGES:true}

ocr:
  enabled: ${OCR_ENABLED:false}
  tesseract:
    path: ${OCR_TESSERACT_PATH:tesseract}

storage:
  local:
    root: ${STORAGE_LOCAL_ROOT:uploads/documents}
  assets:
    root: ${STORAGE_ASSETS_ROOT:uploads/assets}
  vectorstore:
    file: ${VECTOR_STORE_FILE:uploads/vector_store.json}
  upload:
    max-file-size: ${MAX_FILE_SIZE:10MB}
  chunking:
    target-chunk-tokens: ${CHUNK_TARGET_TOKENS:800}
    min-chunk-chars: ${CHUNK_MIN_CHARS:200}
    min-chunk-length-to-embed: ${CHUNK_MIN_LENGTH_TO_EMBED:5}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
